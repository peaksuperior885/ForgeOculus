plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'application'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.gradleup.shadow' version '9.4.2'
}

group = maven_group
version = mod_version

base {
    archivesName = "${archives_base_name}-mc${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

println "Java ${System.getProperty 'java.version'} | JVM ${System.getProperty 'java.vm.version'} | ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://cursemaven.com' }
    maven { url 'https://api.modrinth.com/maven' }
    maven { url 'https://maven.blamejared.com/' }
    maven { url "https://maven.taumc.org/releases" }
}

mixin {
    add sourceSets.main, "mixins.oculus.refmap.json"
    config "mixins.oculus.json"
}

configurations {
    bundle
    implementation.extendsFrom bundle
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.3"
    runtimeOnly "io.github.llamalad7:mixinextras-forge:0.5.3"

    bundle "org.antlr:antlr4-runtime:4.13.1"
    bundle files("libs/taumc-glsl.jar")
    bundle files('libs/glsl-transformer-2.0.1.jar')
    bundle 'org.anarres:jcpp:1.4.14'
    bundle 'blue.endless:jankson:1.2.3'

    runtimeOnly files("libs/taumc-glsl.jar")
    runtimeOnly files('libs/glsl-transformer-2.0.1.jar')

    compileOnly fg.deobf(group: 'flatdir', name: 'Beddium', version: '1.0.10')
    implementation fg.deobf("maven.modrinth:distanthorizonsapi:3.0.0")

    implementation 'com.github.zafarkhaja:java-semver:0.9.0'
    implementation 'org.apache.ant:ant:1.10.14'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.shadowJar {
    archiveClassifier.set('all')
    configurations = [project.configurations.bundle]

    relocate 'org.anarres.cpp', "${maven_group}.bundle.jcpp"
    relocate 'org.taumc.glsl', "${maven_group}.bundle.glsl"
    relocate 'io.github.douira.glsl_transformer', "${maven_group}.bundle.glsl"
    relocate 'org.antlr.v4', "${maven_group}.bundle.antlr"
    relocate 'blue.endless', "${maven_group}.bundle.jankson"

    dependencies {
        exclude(dependency('org.jetbrains.kotlin:.*'))
        exclude(dependency('org.slf4j:.*'))
        exclude(dependency('net.sf.jopt-simple:.*'))
        exclude(dependency('com.google.code.gson:gson:.*'))
    }

    exclude 'kotlin/**'
    exclude 'kotlinx/**'
    exclude 'META-INF/kotlin*'
    exclude 'META-INF/versions/**'
    exclude 'javax/**'
    exclude 'org/apache/**'
    exclude 'com/google/**'
    exclude 'com/fasterxml/**'
    exclude 'org/jetbrains/annotations/**'
    exclude 'org/json/**'
    exclude 'org/jsoup/**'
    exclude 'org/jspecify/**'
    exclude 'org/mozilla/**'
    exclude 'org/intellij/**'
}

application {
    mainClass = 'net.irisshaders.iris.LaunchWarn'
}

jar{
    manifest {
        attributes([
                'MixinConfigs': 'mixins.oculus.json,mixins.oculus.vertexformat.json,mixins.oculus.bettermipmaps.json,mixins.oculus.fixes.maxfpscrash.json,oculus-batched-entity-rendering.mixins.json,mixins.oculus.compat.embeddium.json',
                'Main-Class': application.mainClass
        ])
    }
}

tasks.build.dependsOn shadowJar

tasks.named('processResources', ProcessResources).configure {
    def props = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.shadow

            groupId = project.group
            artifactId = base.archivesName.get()
            version = project.version
        }
    }

    repositories {
        maven {
            name = "githubPages"
            url = uri("${buildDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}