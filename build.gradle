plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = maven_group
version = mod_version

base {
    archivesName = "${archives_base_name}-mc${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

println "Java ${System.getProperty 'java.version'} | JVM ${System.getProperty 'java.vm.version'} | ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://cursemaven.com' }
    maven { url 'https://api.modrinth.com/maven' }
    maven { url 'https://maven.blamejared.com/' }
    maven {
        url "https://maven.irisshaders.net/repositories/releases"
        content {
            includeGroup "net.irisshaders"
            includeGroup "net.irisshaders.iris"
            includeGroup "io.github.douira"
        }
    }
    maven { url = "https://maven.taumc.org/releases" }
}

mixin {
    add sourceSets.main, "mixins.oculus.refmap.json"
    config "mixins.oculus.json"
}

// Deps to embed directly inside the jar at class level (fat jar)
configurations {
    bundle
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation "io.github.llamalad7:mixinextras-common:0.5.3"
    implementation "io.github.llamalad7:mixinextras-forge:0.5.3"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.3"
    annotationProcessor "io.github.llamalad7:mixinextras-forge:0.5.3"

    bundle "org.antlr:antlr4-runtime:4.13.1"
    implementation "org.antlr:antlr4-runtime:4.13.1"

    bundle("org.taumc:glsl-transformation-lib:0.2.0-20.ge3cb096") { transitive = false }
    implementation("org.taumc:glsl-transformation-lib:0.2.0-20.ge3cb096") { transitive = false }

    bundle files('libs/glsl-transformer-2.0.1.jar')
    implementation files('libs/glsl-transformer-2.0.1.jar')

    compileOnly fg.deobf(group: 'flatdir', name: 'Beddium', version: '1.0.10') { transitive = false }
    implementation fg.deobf("maven.modrinth:distanthorizonsapi:3.0.0")

    implementation 'com.github.zafarkhaja:java-semver:0.9.0'
    implementation 'org.apache.ant:ant:1.10.14'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Fat jar - embed bundle deps as classes directly into the jar
// This means .\gradlew jar produces a single self-contained jar
jar {
    from {
        configurations.bundle.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'MixinConfigs': 'mixins.oculus.json,mixins.oculus.fantastic.json,mixins.oculus.vertexformat.json,mixins.oculus.bettermipmaps.json,mixins.oculus.fixes.maxfpscrash.json,oculus-batched-entity-rendering.mixins.json,mixins.oculus.compat.embeddium.json',
                'Main-Class': 'net.irisshaders.iris.LaunchWarn'
        ])
    }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
