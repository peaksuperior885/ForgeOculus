# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
systemProp.org.gradle.internal.http.connectionTimeout=600000
systemProp.org.gradle.internal.http.socketTimeout=600000
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=false
org.gradle.configuration-cache=false

mapping_channel=parchment
mapping_version=2024.11.17-1.21.1
# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
forge_version=52.0.36
forge_version_range=[52.0.36,)
loader_version_range=[1,)
# Mod Properties
mod_id=oculus
mod_name=NeOculus
mod_license=LGPLv3
mod_version=1.8.7
mod_authors=name
mod_description=A port of Iris/Oculus for 1.21.1

# Project Metadata
maven_group=net.irisshaders.iris
archives_base_name=oculus

# Tell Mixin NOT to use SRG/Searge as the target remapper
mixin.remapping.remapper=mojmap
mixin.target.remapper=mojmap

org.gradle.java.home=C:/Program Files/Java/jdk-21

# Dependencies
embeddium_version=1.0.15+mc1.21.1
acceleratedrendering_version=1.0.0
